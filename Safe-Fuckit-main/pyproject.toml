[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safefuckit"
version = "0.1.0"
description = "Decorator and context manager for isolating exceptions and rolling back simple global state."
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["safefuckit*"]
