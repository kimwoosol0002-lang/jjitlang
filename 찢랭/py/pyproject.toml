[project]
name = "jjitlang"
version = "1.0.0"
description = "찢랭 (Jjit-lang) - An esoteric programming language"
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["jjitlang*"]
